openapi: 3.1.0
info:
  title: Monitoring API
  version: 0.1.0
  description: |
    Fairness and exclusion monitoring metrics and breaches (BR-4).
    Metric submit accepts API key; list/breach ops accept bearer or API key.
  license:
    name: Proprietary
    url: https://paritya.local/license
  x-domain: mon
servers:
  - url: https://api.paritya.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Monitoring
    description: Fairness monitoring metrics
  - name: Breaches
    description: Fairness threshold breaches
paths:
  /v1/monitoring/metrics:
    get:
      operationId: listMonitoringMetrics
      summary: List monitoring metrics
      tags: [Monitoring]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: useCaseId
          in: query
          schema:
            type: string
        - name: thresholdBreached
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: ./monitoring.schemas.yaml#/components/schemas/MonitoringMetricListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: submitMonitoringMetric
      summary: Submit a monitoring metric (machine / API key)
      tags: [Monitoring]
      security:
        - apiKey: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./monitoring.schemas.yaml#/components/schemas/MonitoringMetricCreateRequest
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: ./monitoring.schemas.yaml#/components/schemas/MonitoringMetricResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/monitoring/breaches:
    get:
      operationId: listFairnessBreaches
      summary: List fairness breaches
      tags: [Breaches]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: useCaseId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: ./monitoring.schemas.yaml#/components/schemas/FairnessBreachStatus
      responses:
        '200':
          description: Breaches
          content:
            application/json:
              schema:
                $ref: ./monitoring.schemas.yaml#/components/schemas/FairnessBreachListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createFairnessBreach
      summary: Create fairness breach
      tags: [Breaches]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./monitoring.schemas.yaml#/components/schemas/FairnessBreachCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./monitoring.schemas.yaml#/components/schemas/FairnessBreachResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
